name: publish-stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        type: string
      store:
        description: Store to submit to
        required: true
        default: both
        type: choice
        options:
          - both
          - firefox
          - chrome

permissions:
  contents: read

concurrency:
  group: publish-stores-${{ inputs.tag }}-${{ inputs.store }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      package-sha256: ${{ steps.release.outputs.package-sha256 }}
      sources-sha256: ${{ steps.release.outputs.sources-sha256 }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes imagemagick zip
      - name: Rebuild selected release
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Validate release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          manifest_version=$(node -p 'require("./manifest.json").version')
          test "$version" = "$manifest_version"
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          grep -Fx "sudont-${version}.zip" <<<"$assets"
          grep -Fx "sudont-${version}-sources.zip" <<<"$assets"
          gh release download "$RELEASE_TAG" --pattern "sudont-${version}.zip" --pattern "sudont-${version}-sources.zip"
          git archive --format=zip --output=expected-sources.zip HEAD
          VERSION="$version" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          def contents(path):
              with ZipFile(path) as archive:
                  names = archive.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit(f'Duplicate entries in {path}')
                  return {entry.filename: archive.read(entry) for entry in archive.infolist() if not entry.is_dir()}

          version = os.environ['VERSION']
          package_path = Path(f'sudont-{version}.zip')
          sources_path = Path(f'sudont-{version}-sources.zip')
          package = contents(package_path)
          sources = contents(sources_path)
          for archive in (package, sources):
              if json.loads(archive['manifest.json'])['version'] != version:
                  raise SystemExit('Archive manifest version does not match release')
          if sources != contents('expected-sources.zip'):
              raise SystemExit('Source archive does not match selected tag')
          expected = {path.relative_to('dist').as_posix(): path.read_bytes()
                      for path in Path('dist').rglob('*') if path.is_file() and not path.name.endswith('.map')}
          if package != expected:
              raise SystemExit('Extension package does not match rebuilt release')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'package-sha256={hashlib.sha256(package_path.read_bytes()).hexdigest()}\n')
              output.write(f'sources-sha256={hashlib.sha256(sources_path.read_bytes()).hexdigest()}\n')
          PY

  publish-firefox:
    needs: prepare
    if: ${{ inputs.store == 'both' || inputs.store == 'firefox' }}
    runs-on: ubuntu-24.04
    environment: browser-stores
    steps:
      - name: Download release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "sudont-${VERSION}.zip" --pattern "sudont-${VERSION}-sources.zip"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
      - name: Verify downloaded assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_SHA256: ${{ needs.prepare.outputs.package-sha256 }}
          SOURCES_SHA256: ${{ needs.prepare.outputs.sources-sha256 }}
        run: |
          printf '%s  sudont-%s.zip\n%s  sudont-%s-sources.zip\n' "$PACKAGE_SHA256" "$VERSION" "$SOURCES_SHA256" "$VERSION" | sha256sum --check --strict
      - name: Create Mozilla metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const releaseNotes = fs.readFileSync('release-notes.md', 'utf8').trim();
          fs.writeFileSync('amo-metadata.json', JSON.stringify({
            version: {
              release_notes: {
                'en-US': releaseNotes || `Release ${process.env.VERSION}`
              }
            }
          }));
          NODE
      - name: Submit to Firefox Add-ons
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir extension
          unzip -q "sudont-${VERSION}.zip" -d extension
          npx --yes web-ext@10.7.0 sign \
            --source-dir=extension \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --upload-source-code="sudont-${VERSION}-sources.zip" \
            --approval-timeout=0

  publish-chrome:
    needs: prepare
    if: ${{ inputs.store == 'both' || inputs.store == 'chrome' }}
    runs-on: ubuntu-24.04
    environment: browser-stores
    steps:
      - name: Download extension package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "sudont-${VERSION}.zip"
      - name: Verify downloaded package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_SHA256: ${{ needs.prepare.outputs.package-sha256 }}
        run: |
          printf '%s  sudont-%s.zip\n' "$PACKAGE_SHA256" "$VERSION" | sha256sum --check --strict
      - name: Prepare Chrome package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir extension
          unzip -q "sudont-${VERSION}.zip" -d extension
          node - <<'NODE'
          const fs = require('fs');
          const manifestPath = 'extension/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.background = { service_worker: manifest.background.scripts[0] };
          delete manifest.browser_specific_settings;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          rm "sudont-${VERSION}.zip"
          (cd extension && zip -q -r "../sudont-${VERSION}.zip" . -x '*.map')
      - name: Authenticate with Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload extension to Chrome Web Store
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$CHROME_EXTENSION_ID"
          test -n "$CHROME_PUBLISHER_ID"
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@sudont-${VERSION}.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:upload")
          printf '%s\n' "$response"
          for attempt in {1..60}; do
            state=$(python3 -c 'import json, sys; print(json.load(sys.stdin).get("uploadState", ""))' <<<"$response")
            case "$state" in
              SUCCEEDED) break ;;
              UPLOAD_IN_PROGRESS)
                if [ "$attempt" -eq 60 ]; then
                  echo 'Chrome upload processing timed out' >&2
                  exit 1
                fi
                sleep 10
                response=$(curl --fail-with-body --silent --show-error --max-time 30 \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:fetchStatus")
                printf '%s\n' "$response"
                ;;
              *)
                printf 'Chrome upload did not succeed: %s\n' "$state" >&2
                exit 1
                ;;
            esac
          done
      - name: Submit extension for Chrome review
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"publishType":"DEFAULT_PUBLISH","deployInfos":[{"deployPercentage":100}],"blockOnWarnings":true}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:publish"
